<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help is Coming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="sos-screen">
    <header>
        <h1 style="color: var(--gemini-teal);">Request Sent</h1>
    </header>

    <main>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span style="color: var(--gemini-teal); font-weight: bold; letter-spacing: 1px;">LIVE TRACKING</span>
        </div>

        <div class="timer-container">
            <div id="timer">05:00</div>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: -10px; letter-spacing: 1px;">ESTIMATED ARRIVAL</p>
        </div>
        
        <div class="status-box">
            <p><strong>Status:</strong> Staff Dispatched</p>
            <p class="gemini-msg">
                "Gemini Triage: Emergency team is on the way to Room <span id="rm"></span>. Keep your door unlocked if possible."
            </p>
        </div>
    </main>
</div>

<script src="script.js"></script>

</body>
</html>
