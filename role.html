<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrisisSync - Identify Role</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sos-screen">
        <header>
            <h1>Identify Your Role</h1>
            <p style="color: var(--text-muted);">Are you reporting or responding?</p>
        </header>

        <main style="display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 40px;">
            <button class="choice-btn" onclick="window.location.href='info.html'" 
                    style="width: 280px; padding: 25px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--accent-red); color: white; cursor: pointer;">
                <span style="font-size: 1.2rem; font-weight: bold;">GUEST PORTAL</span><br>
                <small style="color: gray;">I need help/Reporting emergency</small>
            </button>

            <button class="choice-btn" onclick="window.location.href='staff-login.html'" 
                    style="width: 280px; padding: 25px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid #00d1b2; color: white; cursor: pointer;">
                <span style="font-size: 1.2rem; font-weight: bold;">STAFF PORTAL</span><br>
                <small style="color: gray;">I am on duty/Responding</small>
            </button>
        </main>
    </div>
</body>
</html>
