<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - CrisisSync</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .screen { display: none; padding: 20px; }
        .active-screen { display: block; }
        .nav-bar { display: flex; justify-content: space-around; background: #111; padding: 15px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #333; }
        .alert-card { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid gray; }
        .CRITICAL { border-left-color: #ff4d4d; }
        .MEDIUM { border-left-color: #ffcc00; }
        .LOW { border-left-color: #00d1b2; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; float: right; font-weight: bold; }
        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="screen-alerts" class="screen active-screen">
        <header><h1>Active Alerts</h1></header>
        <div id="alerts-list">
            <p>Scanning for emergencies...</p>
        </div>
    </div>

    <div id="screen-detail" class="screen">
        <header><button onclick="showScreen('screen-alerts')">← Back</button><h1>Incident Detail</h1></header>
        <div id="detail-content" class="status-box">
            </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button id="sosButton" style="background:var(--accent-red); height:50px;" onclick="window.location.href='tel:112'">ESCALATE (112)</button>
            <button id="photoButton" style="height:50px;" onclick="resolveCurrent()">RESOLVE</button>
        </div>
    </div>

    <div id="screen-duty" class="screen">
        <header><h1>Staff Settings</h1></header>
        <div class="toggle-container">
            <span>On-Duty Status</span>
            <input type="checkbox" id="dutyToggle" onchange="toggleDuty(this.checked)">
        </div>
        <p id="dutyStatus" style="margin-top:10px; color:var(--text-muted);">You are currently OFF duty.</p>
    </div>

    <div id="screen-history" class="screen">
        <header><h1>Incident History</h1></header>
        <div id="history-list"></div>
    </div>

    <nav class="nav-bar">
        <button onclick="showScreen('screen-alerts')">Alerts</button>
        <button onclick="showScreen('screen-duty')">Duty</button>
        <button onclick="showScreen('screen-history')">History</button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAD5cXsGGWzzi7yQnz1nfZcYmfrDZmv--4",
            authDomain: "crisissync-gdg.firebaseapp.com",
            projectId: "crisissync-gdg",
            storageBucket: "crisissync-gdg.firebasestorage.app",
            messagingSenderId: "105702461886",
            appId: "1:105702461886:web:3c9541193e0c93c2a6a9ef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentIncidentId = null;

        // --- NAVIGATION LOGIC ---
        window.showScreen = (screenId) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        };

        // --- SCREEN 1: REAL-TIME ALERTS ---
        const qActive = query(collection(db, "incidents"), where("status", "==", "active"), orderBy("timestamp", "desc"));
        onSnapshot(qActive, (snap) => {
            const list = document.getElementById('alerts-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const item = d.data();
                const severity = (item.incidentType === 'Fire' || item.incidentType === 'Medical') ? 'CRITICAL' : 'MEDIUM';
                const div = document.createElement('div');
                div.className = `alert-card ${severity}`;
                div.onclick = () => showDetails(d.id, item);
                div.innerHTML = `
                    <span class="badge ${severity}">${severity}</span>
                    <strong>Room ${item.roomNumber}</strong><br>
                    <small>${item.incidentType} | ${new Date(item.timestamp?.toDate()).toLocaleTimeString()}</small>
                `;
                list.appendChild(div);
            });
        });

        // --- SCREEN 2: DETAILS LOGIC ---
        window.showDetails = (id, data) => {
            currentIncidentId = id;
            document.getElementById('detail-content').innerHTML = `
                <h3>Room ${data.roomNumber}</h3>
                <p><strong>Type:</strong> ${data.incidentType}</p>
                <hr>
                <p class="gemini-msg"><strong>Gemini Triage:</strong> Analyzing situation for staff...</p>
                <ul>
                    <li>Clear the hallways.</li>
                    <li>Bring the emergency kit.</li>
                </ul>
            `;
            showScreen('screen-detail');
        };

        window.resolveCurrent = async () => {
            if(currentIncidentId) {
                await updateDoc(doc(db, "incidents", currentIncidentId), { status: "resolved" });
                showScreen('screen-alerts');
            }
        };

        // --- SCREEN 3: DUTY TOGGLE ---
        window.toggleDuty = (val) => {
            document.getElementById('dutyStatus').innerText = val ? "You are ON duty. Receiving alerts." : "You are OFF duty.";
            // Here you would normally update Firestore staff collection
        };

        // --- SCREEN 4: HISTORY ---
        const qHistory = query(collection(db, "incidents"), where("status", "==", "resolved"), orderBy("timestamp", "desc"));
        onSnapshot(qHistory, (snap) => {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const item = d.data();
                list.innerHTML += `<div class="alert-card">Room ${item.roomNumber} - ${item.incidentType} (RESOLVED)</div>`;
            });
        });

    </script>
</body>
</html>
